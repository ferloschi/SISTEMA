name: Fix Nginx Config

on:
  push:
    paths:
      - '.github/workflows/fix-nginx.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix nginx via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.131.184.106
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            python3 - << 'PYEOF'
            import subprocess

            config = """server {
    listen 80;
    server_name api.drabrinquinho.com.br;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.drabrinquinho.com.br;
    ssl_certificate /etc/letsencrypt/live/api.drabrinquinho.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.drabrinquinho.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}"""

            with open('/tmp/api.nginx', 'w') as f:
                f.write(config)

            subprocess.run(['sudo', 'cp', '/tmp/api.nginx', '/etc/nginx/sites-available/api'], check=True)
            subprocess.run(['sudo', 'nginx', '-t'], check=True)
            subprocess.run(['sudo', 'systemctl', 'reload', 'nginx'], check=True)
            print("Nginx corrigido com sucesso!")
            PYEOF
